<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dobra Przestrzeń</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h1{
  margin:0;
}

button,
select{
  width:100%;
  padding:14px;
  font-size:18px;
  margin-top:8px;
  border-radius:10px;
}

.primary{
  background:#0f766e;
  color:#fff;
  border:none;
}

.big{
  font-size:24px;
  font-weight:bold;
}

#clientBox{
  display:none;
}

.modeCard{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.checkinBtn{
  background:#16a34a;
  color:white;
  border:none;
  font-weight:bold;
  font-size:22px;
}

.rechargeBtn{
  background:#2563eb;
  color:white;
  border:none;
  font-weight:bold;
  font-size:22px;
}

.confirmRechargeBtn{
  background:#0f766e;
  color:white;
  border:none;
  font-weight:bold;
  font-size:20px;
  margin-top:16px;
}

.addClientBtn{
  background:#7c3aed;
  color:white;
  border:none;
  font-weight:bold;
  font-size:22px;
  transition:.25s;
}

.addClientBtn:hover{
  transform:scale(1.03);
}

.addClientBtn:active{
  transform:scale(.97);
}

.activeMode{
  box-shadow:0 0 0 4px rgba(0,0,0,.15);
  transform:scale(1.03);
}

.resultOk{
  background:#dcfce7;
  border-left:6px solid #16a34a;
  padding:15px;
  border-radius:10px;
}

.resultRecharge{
  background:#dbeafe;
  border-left:6px solid #2563eb;
  padding:15px;
  border-radius:10px;
}

.resultError{
  background:#fee2e2;
  border-left:6px solid #dc2626;
  padding:15px;
  border-radius:10px;
}

.resultName{
  font-size:28px;
  font-weight:bold;
  margin-bottom:10px;
}

.resultValue{
  font-size:36px;
  font-weight:bold;
}

#rechargeOptionsPanel{
  display:none;
  background:#eff6ff;
  padding:15px;
  border-radius:12px;
  border:1px solid #bfdbfe;
}

/* ===== NOWY UCZESTNIK ===== */

#addClientPanel{
  display:none;
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

#addClientPanel h3{
  margin-top:0;
}

#addClientPanel input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:17px;
  box-sizing:border-box;
}

.formButtons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.saveBtn{
  flex:1;
  background:#16a34a;
  color:#fff;
  border:none;
  font-weight:bold;
}

.cancelBtn{
  flex:1;
  background:#dc2626;
  color:#fff;
  border:none;
  font-weight:bold;
}

.optionGroup{
  margin-top:10px;
}

.optionGroup label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

.optionGroup input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:17px;
  box-sizing:border-box;
}

.passSummary{
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#f3f4f6;
  font-size:15px;
  line-height:1.5;
}

</style>
</head>

<body>

<div class="card">

<h1>Dobra Przestrzeń</h1>

<div id="operator">
Ładowanie...
</div>

</div>


<div class="card">

<h3>Zajęcia</h3>

<select id="scheduleSelect">
<option>Ładowanie...</option>
</select>

</div>


<div class="card">

<button
class="primary"
onclick="startScanner()">
URUCHOM SKANER QR
</button>

<div id="reader"></div>

</div>


<div
id="clientBox"
class="card">

<div
id="clientName"
class="big">
</div>

<div
id="clientRemain">
</div>

</div>


<div class="card modeCard">

<button
id="checkinBtn"
class="checkinBtn"
onclick="executeCheckin()">

✅ CHECK-IN

</button>


<button
id="rechargeBtn"
class="rechargeBtn"
onclick="showRechargeOptions()">

💳 DOŁADUJ

</button>


<div
id="rechargeOptionsPanel"
class="optionGroup">

<label>Rodzaj doładowania</label>

<select
id="rechargeMode"
onchange="updateRechargeMode()">

<option value="INDIVIDUAL">
Indywidualne
</option>

<option value="PASS">
Karnet
</option>

</select>


<div id="individualRechargeBox">

<label>Liczba wejść</label>

<select id="rechargeAmount">

<option value="1">+1</option>
<option value="2">+2</option>
<option value="3">+3</option>
<option value="4">+4</option>
<option value="5">+5</option>

</select>

</div>


<div
id="passRechargeBox"
style="display:none;">

<label>Wybierz karnet</label>

<select
id="rechargePass"
onchange="updateRechargePassSummary()">
</select>


<label>Start karnetu</label>

<input
id="rechargeStartDate"
type="date"
onchange="updateRechargePassSummary()">


<div
id="rechargePassSummary"
class="passSummary">
</div>

</div>


<button
class="confirmRechargeBtn"
onclick="executeRecharge()">

✅ ZATWIERDŹ DOŁADOWANIE

</button>

</div>


<button
id="addClientBtn"
class="addClientBtn"
onclick="showAddClient()">

👤 NOWY UCZESTNIK

</button>

</div>


<div
id="addClientPanel"
class="card">

<h3>👤 Nowy uczestnik</h3>


<input
id="newName"
placeholder="Imię *">


<input
id="newSurname"
placeholder="Nazwisko *">


<input
id="newPhone"
placeholder="Telefon (opcjonalnie)">


<input
id="newEmail"
placeholder="Email (opcjonalnie)">


<div class="optionGroup">

<label>🎫 Pakiet startowy</label>

<select
id="newRechargeMode"
onchange="updateNewClientRechargeMode()">

<option value="NONE">
Bez doładowania
</option>

<option value="INDIVIDUAL">
Doładowanie indywidualne
</option>

<option value="PASS">
Karnet
</option>

</select>


<div
id="newIndividualBox"
style="display:none;">

<label>Liczba wejść</label>

<select id="startPackage">

<option value="1">+1</option>
<option value="2">+2</option>
<option value="3">+3</option>
<option value="4">+4</option>
<option value="5">+5</option>

</select>

</div>


<div
id="newPassBox"
style="display:none;">

<label>Wybierz karnet</label>

<select
id="newPass"
onchange="updateNewPassSummary()">
</select>


<label>Start karnetu</label>

<input
id="newPassStartDate"
type="date"
onchange="updateNewPassSummary()">


<div
id="newPassSummary"
class="passSummary">
</div>

</div>

</div>


<div class="formButtons">

<button
class="saveBtn"
onclick="saveNewClient()">

💾 ZAPISZ

</button>


<button
class="cancelBtn"
onclick="closeAddClient()">

ANULUJ

</button>

</div>

</div>


<script>

const TOKEN =
new URLSearchParams(
  window.location.search
).get("token") || "";


const API_URL =
"https://script.google.com/macros/s/AKfycbwtITjQlWNlWIikKiaZna_CQNwfpFQJ2NQ5VnK8MtAX3i_Af_EG54GdHSHw_hIfJZtSww/exec";


let scanner = null;

let lastScan = "";

let lastScanTime = 0;

let currentClientId = "";

let currentClient = null;

let rechargeOptions = {
  individual:[
    1,
    2,
    3,
    4,
    5
  ],
  passes:[]
};


/************************************************
 * DŹWIĘK
 ************************************************/

function beep(){

  const ctx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  const osc =
    ctx.createOscillator();

  osc.type = "sine";

  osc.frequency.value = 1000;

  osc.connect(
    ctx.destination
  );

  osc.start();

  setTimeout(()=>{

    osc.stop();

  },150);

}


/************************************************
 * API GET
 ************************************************/

async function api(
  action,
  data={}
){

  const params =
    new URLSearchParams({

      action,

      ...data

    });

  const url =
    API_URL +
    "?" +
    params.toString();

  const response =
    await fetch(url);

  const txt =
    await response.text();

  return JSON.parse(txt);

}


/************************************************
 * WYNIK
 ************************************************/

function showResult(
  type,
  title,
  name,
  balance,
  before=""
){

  const box =
    document.getElementById(
      "clientBox"
    );

  box.className =
    "card";

  if(type==="checkin"){

    box.classList.add(
      "resultOk"
    );

    beep();

    if(navigator.vibrate){

      navigator.vibrate([
        200,
        100,
        200
      ]);

    }

  }

  if(type==="recharge"){

    box.classList.add(
      "resultRecharge"
    );

    beep();

    if(navigator.vibrate){

      navigator.vibrate([
        300,
        100,
        300
      ]);

    }

  }

  if(type==="error"){

    box.classList.add(
      "resultError"
    );

    if(navigator.vibrate){

      navigator.vibrate([
        100,
        100,
        100,
        100
      ]);

    }

  }

  document
    .getElementById(
      "clientName"
    )
    .innerHTML =
      name || "";

  let html =
    title;

  if(before !== ""){

    html +=
      "<br><br>Stan: <b>" +
      before +
      " → " +
      balance +
      "</b>";

  }
  else{

    html +=
      "<br><br>Aktualny stan: <b>" +
      balance +
      "</b>";

  }

  document
    .getElementById(
      "clientRemain"
    )
    .innerHTML =
      html;

  box.style.display =
    "block";

}


/************************************************
 * INICJALIZACJA
 ************************************************/

async function init(){

  try{

    const operator =
      await api(
        "operator",
        {
          token:TOKEN
        }
      );

    document
      .getElementById(
        "operator"
      )
      .innerHTML =
        "Operator: <b>" +
        operator.name +
        "</b>";


    const schedule =
      await api(
        "schedule"
      );

    const sel =
      document.getElementById(
        "scheduleSelect"
      );

    sel.innerHTML = "";

    schedule.forEach(x=>{

      const o =
        document.createElement(
          "option"
        );

      o.value =
        x.day +
        "|" +
        x.hour +
        "|" +
        x.className;

      o.textContent =
        x.day +
        " | " +
        x.hour +
        " | " +
        x.className;

      sel.appendChild(o);

    });


    rechargeOptions =
      await api(
        "rechargeOptions"
      );

    loadPassOptions();

    setDefaultPassDates();

    updateRechargeMode();

    updateNewClientRechargeMode();

  }
  catch(err){

    showResult(
      "error",
      "❌ Błąd inicjalizacji",
      "",
      err.message
    );

  }

}


/************************************************
 * KARNETY
 ************************************************/

function loadPassOptions(){

  const passes =
    Array.isArray(
      rechargeOptions.passes
    )
      ? rechargeOptions.passes
      : [];

  [
    "rechargePass",
    "newPass"
  ].forEach(id=>{

    const sel =
      document.getElementById(id);

    sel.innerHTML = "";

    passes.forEach(pass=>{

      const o =
        document.createElement(
          "option"
        );

      o.value =
        pass.id;

      o.textContent =
        pass.group +
        " | " +
        pass.entries +
        " wejść | " +
        pass.price +
        " zł";

      sel.appendChild(o);

    });

  });

  updateRechargePassSummary();

  updateNewPassSummary();

}


/************************************************
 * DATA
 ************************************************/

function localDateInputValue(date){

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth()+1
    )
      .padStart(
        2,
        "0"
      );

  const d =
    String(
      date.getDate()
    )
      .padStart(
        2,
        "0"
      );

  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}


function setDefaultPassDates(){

  const today =
    localDateInputValue(
      new Date()
    );

  document
    .getElementById(
      "rechargeStartDate"
    )
    .value =
      today;

  document
    .getElementById(
      "newPassStartDate"
    )
    .value =
      today;

}


function getPassByIdClient(id){

  return (
    rechargeOptions.passes || []
  )
    .find(
      x => x.id === id
    ) || null;

}


function calculateEndDateText(
  startText,
  validityDays
){

  if(!startText){

    return "";

  }

  const parts =
    startText
      .split("-")
      .map(Number);

  const d =
    new Date(
      parts[0],
      parts[1]-1,
      parts[2],
      12,
      0,
      0
    );

  d.setDate(
    d.getDate() +
    Number(
      validityDays || 30
    )
  );

  return localDateInputValue(d);

}


/************************************************
 * POKAŻ OPCJE DOŁADOWANIA
 ************************************************/

function showRechargeOptions(){

  if(!currentClientId){

    showResult(
      "error",
      "Najpierw zeskanuj klienta",
      "",
      "-"
    );

    return;

  }

  document
    .getElementById(
      "rechargeOptionsPanel"
    )
    .style.display =
      "block";

  document
    .getElementById(
      "rechargeMode"
    )
    .value =
      "INDIVIDUAL";

  document
    .getElementById(
      "rechargeAmount"
    )
    .value =
      "1";

  updateRechargeMode();

}


/************************************************
 * TRYB DOŁADOWANIA
 ************************************************/

function updateRechargeMode(){

  const isPass =
    document
      .getElementById(
        "rechargeMode"
      )
      .value === "PASS";

  document
    .getElementById(
      "individualRechargeBox"
    )
    .style.display =
      isPass
        ? "none"
        : "block";

  document
    .getElementById(
      "passRechargeBox"
    )
    .style.display =
      isPass
        ? "block"
        : "none";

  if(isPass){

    updateRechargePassSummary();

  }

}


/************************************************
 * PODSUMOWANIE KARNETU
 ************************************************/

function updateRechargePassSummary(){

  const pass =
    getPassByIdClient(
      document
        .getElementById(
          "rechargePass"
        )
        .value
    );

  const start =
    document
      .getElementById(
        "rechargeStartDate"
      )
      .value;

  const box =
    document.getElementById(
      "rechargePassSummary"
    );

  if(!pass){

    box.innerHTML =
      "Brak dostępnych karnetów.";

    return;

  }

  const end =
    calculateEndDateText(
      start,
      pass.validityDays
    );

  box.innerHTML =
    "<b>" +
    pass.group +
    " – " +
    pass.name +
    "</b><br>" +
    "Wejścia: " +
    pass.entries +
    "<br>" +
    "Cena: " +
    pass.price +
    " zł<br>" +
    "Ważność: " +
    pass.validityDays +
    " dni<br>" +
    "Start: <b>" +
    start +
    "</b><br>" +
    "Ważny do: <b>" +
    (
      end ||
      "wybierz datę startu"
    ) +
    "</b>";

}


/************************************************
 * NOWY UCZESTNIK - TRYB
 ************************************************/

function updateNewClientRechargeMode(){

  const mode =
    document
      .getElementById(
        "newRechargeMode"
      )
      .value;

  document
    .getElementById(
      "newIndividualBox"
    )
    .style.display =
      mode === "INDIVIDUAL"
        ? "block"
        : "none";

  document
    .getElementById(
      "newPassBox"
    )
    .style.display =
      mode === "PASS"
        ? "block"
        : "none";

  if(
    mode === "PASS"
  ){

    updateNewPassSummary();

  }

}


function updateNewPassSummary(){

  const pass =
    getPassByIdClient(
      document
        .getElementById(
          "newPass"
        )
        .value
    );

  const start =
    document
      .getElementById(
        "newPassStartDate"
      )
      .value;

  const box =
    document.getElementById(
      "newPassSummary"
    );

  if(!pass){

    box.innerHTML =
      "Brak dostępnych karnetów.";

    return;

  }

  const end =
    calculateEndDateText(
      start,
      pass.validityDays
    );

  box.innerHTML =
    "<b>" +
    pass.group +
    " – " +
    pass.name +
    "</b><br>" +
    "Wejścia: " +
    pass.entries +
    "<br>" +
    "Cena: " +
    pass.price +
    " zł<br>" +
    "Ważność: " +
    pass.validityDays +
    " dni<br>" +
    "Start: <b>" +
    start +
    "</b><br>" +
    "Ważny do: <b>" +
    (
      end ||
      "wybierz datę startu"
    ) +
    "</b>";

}


/************************************************
 * SKANER
 ************************************************/

function startScanner(){

  if(scanner){

    return;

  }

  scanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps:10,
        qrbox:250
      }
    );

  scanner.render(
    onScanSuccess,
    ()=>{}
  );

}


/************************************************
 * SKAN
 ************************************************/

async function onScanSuccess(text){

  const now =
    Date.now();

  if(
    text === lastScan &&
    (
      now -
      lastScanTime
    ) < 5000
  ){

    return;

  }

  lastScan =
    text;

  lastScanTime =
    now;

  try{

    const clientId =
      String(text)
        .split("|")[0]
        .replace(
          /\s/g,
          ""
        )
        .trim();

    const preview =
      await api(
        "preview",
        {
          token:TOKEN,
          clientId:clientId
        }
      );

    if(!preview.ok){

      showResult(
        "error",
        preview.msg,
        "",
        "-"
      );

      return;

    }

    currentClientId =
      clientId;

    currentClient =
      preview;

    document
      .getElementById(
        "clientBox"
      )
      .className =
        "card";

    document
      .getElementById(
        "clientBox"
      )
      .style.display =
        "block";

    document
      .getElementById(
        "clientName"
      )
      .innerHTML =
        preview.id +
        "<br>" +
        preview.name;

    document
      .getElementById(
        "clientRemain"
      )
      .innerHTML =
        "Aktualny stan: <b>" +
        preview.remaining +
        "</b><br><br>" +
        "Wybierz operację:";

    document
      .getElementById(
        "rechargeOptionsPanel"
      )
      .style.display =
        "none";

  }
  catch(err){

    showResult(
      "error",
      "❌ Błąd skanowania",
      "",
      err.message
    );

  }

}


/************************************************
 * CHECK-IN
 ************************************************/

async function executeCheckin(){

  if(!currentClientId){

    showResult(
      "error",
      "Najpierw zeskanuj klienta",
      "",
      "-"
    );

    return;

  }

  const selected =
    document
      .getElementById(
        "scheduleSelect"
      )
      .value
      .split("|");

  const result =
    await api(
      "checkin",
      {

        token:TOKEN,

        clientId:
          currentClientId,

        day:
          selected[0],

        hour:
          selected[1],

        className:
          selected[2]

      }
    );

  if(!result.ok){

    showResult(
      "error",
      result.msg,
      "",
      "-"
    );

    return;

  }

  const preview =
    await api(
      "preview",
      {

        token:TOKEN,

        clientId:
          currentClientId

      }
    );

  showResult(
    "checkin",
    "✅ CHECK-IN OK",
    preview.id +
      "<br>" +
      preview.name,
    preview.remaining,
    result.before
  );

  currentClientId = "";

  currentClient = null;

}


/************************************************
 * DOŁADOWANIE
 ************************************************/

async function executeRecharge(){

  if(!currentClientId){

    showResult(
      "error",
      "Najpierw zeskanuj klienta",
      "",
      "-"
    );

    return;

  }

  const rechargeMode =
    document
      .getElementById(
        "rechargeMode"
      )
      .value;

  const data = {

    token:
      TOKEN,

    clientId:
      currentClientId,

    mode:
      rechargeMode

  };

  let resultTitle = "";

  if(
    rechargeMode ===
    "INDIVIDUAL"
  ){

    const amount =
      document
        .getElementById(
          "rechargeAmount"
        )
        .value;

    data.amount =
      amount;

    resultTitle =
      "➕ DOŁADOWANO +" +
      amount;

  }
  else{

    const packageId =
      document
        .getElementById(
          "rechargePass"
        )
        .value;

    const startDate =
      document
        .getElementById(
          "rechargeStartDate"
        )
        .value;

    if(!packageId){

      showResult(
        "error",
        "Wybierz karnet",
        "",
        "-"
      );

      return;

    }

    if(!startDate){

      showResult(
        "error",
        "Wybierz datę startu karnetu",
        "",
        "-"
      );

      return;

    }

    data.amount =
      0;

    data.packageId =
      packageId;

    data.startDate =
      startDate;

    resultTitle =
      "🎫 KARNET AKTYWOWANY";

  }

  const result =
    await api(
      "recharge",
      data
    );

  if(!result.ok){

    showResult(
      "error",
      result.msg,
      "",
      "-"
    );

    return;

  }

  const preview =
    await api(
      "preview",
      {

        token:TOKEN,

        clientId:
          currentClientId

      }
    );

  if(
    result.type ===
    "KARNET"
  ){

    resultTitle +=
      "<br>" +
      result.packageName +
      "<br>" +
      result.added +
      " wejść | " +
      result.price +
      " zł" +
      "<br>" +
      result.start +
      " → " +
      result.end;

  }

  showResult(
    "recharge",
    resultTitle,
    preview.id +
      "<br>" +
      preview.name,
    preview.remaining,
    result.before
  );

  document
    .getElementById(
      "rechargeOptionsPanel"
    )
    .style.display =
      "none";

  currentClientId = "";

  currentClient = null;

}


/************************************************
 * NOWY UCZESTNIK
 ************************************************/

function showAddClient(){

  beep();

  document
    .getElementById(
      "addClientPanel"
    )
    .style.display =
      "block";

  document
    .getElementById(
      "newName"
    )
    .focus();

}


function closeAddClient(){

  document
    .getElementById(
      "addClientPanel"
    )
    .style.display =
      "none";

}


async function saveNewClient(){

  try{

    const firstName =
      document
        .getElementById(
          "newName"
        )
        .value
        .trim();

    const lastName =
      document
        .getElementById(
          "newSurname"
        )
        .value
        .trim();

    const phone =
      document
        .getElementById(
          "newPhone"
        )
        .value
        .trim();

    const email =
      document
        .getElementById(
          "newEmail"
        )
        .value
        .trim();

    const newMode =
      document
        .getElementById(
          "newRechargeMode"
        )
        .value;

    if(firstName===""){

      alert(
        "Podaj imię."
      );

      return;

    }

    if(lastName===""){

      alert(
        "Podaj nazwisko."
      );

      return;

    }

    const emailRegex =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(
      email !== "" &&
      !emailRegex.test(email)
    ){

      alert(
        "Niepoprawny adres e-mail."
      );

      return;

    }

    const data = {

      token:
        TOKEN,

      firstName,

      lastName,

      phone,

      email,

      startPackage:
        0,

      forceCreate:
        false,

      rechargeMode:
        "INDIVIDUAL"

    };

    if(
      newMode ===
      "INDIVIDUAL"
    ){

      data.startPackage =
        document
          .getElementById(
            "startPackage"
          )
          .value;

      data.rechargeMode =
        "INDIVIDUAL";

    }

    if(
      newMode ===
      "PASS"
    ){

      const packageId =
        document
          .getElementById(
            "newPass"
          )
          .value;

      const startDate =
        document
          .getElementById(
            "newPassStartDate"
          )
          .value;

      if(!packageId){

        alert(
          "Wybierz karnet."
        );

        return;

      }

      if(!startDate){

        alert(
          "Wybierz datę startu karnetu."
        );

        return;

      }

      data.rechargeMode =
        "PASS";

      data.packageId =
        packageId;

      data.startDate =
        startDate;

    }

    const result =
      await api(
        "addClient",
        data
      );

    if(
      result.duplicate
    ){

      alert(
        result.msg ||
        "Uczestnik już istnieje."
      );

      return;

    }

    if(!result.ok){

      alert(
        result.msg
      );

      return;

    }

    let message =
      "✅ Dodano uczestnika\n\n" +
      "ID: " +
      result.id;

    if(
      result.rechargeType ===
      "KARNET"
    ){

      message +=
        "\n\nKarnet: " +
        result.packageId +
        "\nDodano: " +
        result.added +
        " wejść" +
        "\nStart: " +
        result.start +
        "\nWażny do: " +
        result.end;

    }

    if(
      result.rechargeType ===
      "INDYWIDUALNE"
    ){

      message +=
        "\n\nDoładowanie: +" +
        result.added;

    }

    alert(
      message
    );

    document
      .getElementById(
        "newName"
      )
      .value =
        "";

    document
      .getElementById(
        "newSurname"
      )
      .value =
        "";

    document
      .getElementById(
        "newPhone"
      )
      .value =
        "";

    document
      .getElementById(
        "newEmail"
      )
      .value =
        "";

    document
      .getElementById(
        "newRechargeMode"
      )
      .value =
        "NONE";

    updateNewClientRechargeMode();

    closeAddClient();

  }
  catch(err){

    console.error(err);

    alert(
      "Błąd połączenia z serwerem.\n\n" +
      err.message
    );

  }

}


window.onload =
  init;

</script>
