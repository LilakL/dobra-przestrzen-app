<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Dobra Przestrzeń – Rezerwacje</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7f6;
  color: #26332d;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px;
}


/************************************************
 * HEADER
 ************************************************/

.header {
  background: white;
  border-radius: 20px;
  padding: 28px 24px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #286247;
}

.subtitle {
  margin-top: 8px;
  color: #68756e;
}

.client {
  margin-top: 20px;
  padding: 15px;
  background: #eef5f1;
  border-radius: 12px;
}


/************************************************
 * SEKCJE
 ************************************************/

.section-title {
  font-size: 22px;
  margin: 25px 0 12px;
  color: #26332d;
}


/************************************************
 * EVENTY SPECJALNE
 ************************************************/

.events-section {
  margin-top: 25px;
  margin-bottom: 30px;
}

.events-header {
  background:
    linear-gradient(
      135deg,
      #285c45,
      #3c765b
    );

  color: white;
  padding: 24px;
  border-radius: 20px 20px 0 0;
}

.events-header-label {
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1.5px;
  opacity: .85;
}

.events-header-title {
  font-size: 26px;
  font-weight: bold;
  margin-top: 7px;
}

.events-header-text {
  margin-top: 10px;
  line-height: 1.6;
  font-size: 15px;
  color: #e3f2e9;
}

.events-container {
  background: #edf5f0;
  padding: 16px;
  border-radius: 0 0 20px 20px;
}

.event-card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,.06);
  border: 1px solid #dfeae3;
}

.event-card:last-child {
  margin-bottom: 0;
}

.event-date {
  color: #286247;
  font-size: 13px;
  letter-spacing: .5px;
  font-weight: bold;
  text-transform: uppercase;
}

.event-name {
  margin-top: 7px;
  font-size: 21px;
  font-weight: bold;
  line-height: 1.35;
  color: #214f3a;
}

.event-description {
  margin-top: 10px;
  color: #5f6d65;
  font-size: 15px;
  line-height: 1.6;
}

.event-availability {
  margin-top: 15px;
  background: #f5f9f6;
  border-radius: 10px;
  padding: 11px 13px;
  font-size: 14px;
  color: #536158;
}


/************************************************
 * REGULARNY GRAFIK
 ************************************************/

.day {
  margin-bottom: 22px;
}

.day-title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.class-card {
  background: white;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.class-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.class-name {
  font-size: 17px;
  font-weight: bold;
}

.hour {
  color: #286247;
  font-weight: bold;
  white-space: nowrap;
}

.info {
  margin-top: 8px;
  color: #68756e;
  font-size: 14px;
}


/************************************************
 * BUTTONY
 ************************************************/

button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.reserve {
  background: #286247;
  color: white;
}

.reserve:hover:not(:disabled) {
  background: #214f3a;
}

.reserve:disabled {
  background: #c8cfcb;
  cursor: not-allowed;
}

.event-reserve {
  padding: 14px;
  font-size: 16px;
}

.cancel {
  background: #f2e5e5;
  color: #8a3030;
}


/************************************************
 * KOMUNIKATY
 ************************************************/

.loading {
  text-align: center;
  padding: 40px 10px;
  color: #68756e;
}

.error {
  background: #fbe9e9;
  color: #8a3030;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.success {
  background: #e8f5ec;
  color: #286247;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}


/************************************************
 * REZERWACJE
 ************************************************/

.reservation {
  background: white;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.empty {
  color: #68756e;
  padding: 15px 0;
}


/************************************************
 * STATUS KARNETU / WEJŚĆ
 ************************************************/

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.header-brand {
  min-width: 0;
}

.client-status-card {
  min-width: 245px;
  max-width: 285px;
  padding: 16px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eef5f1, #f8fbf9);
  border: 1px solid #dce9e1;
}

.client-status-label {
  color: #68756e;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .8px;
  text-transform: uppercase;
}

.client-status-balance {
  margin-top: 4px;
  color: #286247;
  font-size: 32px;
  line-height: 1.1;
  font-weight: bold;
}

.client-status-validity {
  margin-top: 7px;
  color: #536158;
  font-size: 13px;
  line-height: 1.45;
}

.client-status-divider {
  height: 1px;
  margin: 12px 0 10px;
  background: #dce9e1;
}

.client-status-last-label {
  color: #68756e;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: .5px;
  text-transform: uppercase;
}

.client-status-last {
  margin-top: 4px;
  color: #34433b;
  font-size: 13px;
  line-height: 1.45;
}


/************************************************
 * MOBILE
 ************************************************/

@media (max-width: 600px) {

  .container {
    padding: 12px;
  }

  .header {
    padding: 22px 18px;
  }

  .header-top {
    display: block;
  }

  .client-status-card {
    min-width: 0;
    max-width: none;
    width: 100%;
    margin-top: 18px;
  }

  .client-status-balance {
    font-size: 29px;
  }

  .events-header {
    padding: 22px 18px;
  }

  .events-header-title {
    font-size: 23px;
  }

  .event-card {
    padding: 18px;
  }

  .event-name {
    font-size: 19px;
  }

}

</style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="header-top">

      <div class="header-brand">

        <div class="logo">
          Dobra Przestrzeń
        </div>

        <div class="subtitle">
          Rezerwacje
        </div>

      </div>

      <div
        id="clientStatus"
        class="client-status-card"
        style="display:none;"
      ></div>

    </div>

    <div
      id="client"
      class="client"
      style="display:none;"
    ></div>

  </div>


  <div id="message"></div>


  <!-- MOJE REZERWACJE -->

  <div id="reservationsSection">

    <div class="section-title">
      Moje rezerwacje
    </div>

    <div id="reservations">

      <div class="loading">
        Ładowanie...
      </div>

    </div>

  </div>


  <!-- EVENTY -->

  <div
    id="eventsSection"
    class="events-section"
    style="display:none;"
  >

    <div class="events-header">

      <div class="events-header-label">
        DOBRA PRZESTRZEŃ
      </div>

      <div class="events-header-title">
        ✨ Wydarzenia specjalne
      </div>

      <div class="events-header-text">
        Wyjątkowe spotkania stworzone po to,
        aby znaleźć czas dla siebie,
        dobrych ludzi i dobrej energii.
      </div>

    </div>

    <div
      id="events"
      class="events-container"
    ></div>

  </div>


  <!-- REGULARNE ZAJĘCIA -->

  <div
    id="classesSection"
  >

    <div class="section-title">
      Dostępne zajęcia
    </div>

    <div id="schedule">

      <div class="loading">
        Ładowanie grafiku...
      </div>

    </div>

  </div>


</div>


<script>

/************************************************
 * KONFIGURACJA
 ************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbw9xYY7qrNakOsqttH7nnV21MYAVCOkSw1MfAmN8RACMfWq1PvQgV8-7Z5fraPN10GoQQ/exec";


/************************************************
 * TOKEN KLIENTKI
 ************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );

const token =
  params.get("token");


/************************************************
 * ELEMENTY
 ************************************************/

const clientBox =
  document.getElementById("client");

const clientStatusBox =
  document.getElementById("clientStatus");

const scheduleBox =
  document.getElementById("schedule");

const eventsBox =
  document.getElementById("events");

const eventsSection =
  document.getElementById("eventsSection");

const reservationsBox =
  document.getElementById("reservations");

const messageBox =
  document.getElementById("message");


/************************************************
 * KOMUNIKAT
 ************************************************/

function showMessage(
  text,
  type = "success"
) {

  messageBox.innerHTML = `
    <div class="${type}">
      ${text}
    </div>
  `;

}


/************************************************
 * DATA DZISIAJ
 ************************************************/

function todayString() {

  const d =
    new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );

  const day =
    String(
      d.getDate()
    )
    .padStart(
      2,
      "0"
    );

  return (
    `${year}-${month}-${day}`
  );

}


/************************************************
 * API
 *
 * ODCZYTY:
 * - GET
 *
 * ZAPISY:
 * - POST
 *
 * Dodatkowo:
 * - wyłączony cache
 * - timestamp dla odczytów GET
 ************************************************/

async function api(
  action,
  parameters = {}
) {

  const writeActions =
    new Set([
      "bookingCreate",
      "bookingCancel"
    ]);


  /**********************************************
   * OPERACJE ZAPISUJĄCE — POST
   **********************************************/

  if (
    writeActions.has(
      action
    )
  ) {

    const payload = {

      action:
        action,

      token:
        token,

      ...parameters

    };


    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            ),

          cache:
            "no-store"

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Błąd komunikacji z serwerem."
      );

    }


    return await response.json();

  }
  /**********************************************
   * OPERACJE ODCZYTUJĄCE — GET
   **********************************************/

  const url =
    new URL(
      API_URL
    );


  url.searchParams.set(
    "action",
    action
  );


  url.searchParams.set(
    "token",
    token
  );


  Object.keys(
    parameters
  )
  .forEach(
    key => {

      if (
        parameters[key] !== undefined &&
        parameters[key] !== null
      ) {

        url.searchParams.set(
          key,
          parameters[key]
        );

      }

    }
  );


  /**********************************************
   * CACHE BUSTER
   **********************************************/

  url.searchParams.set(
    "_ts",
    Date.now()
  );


  const response =
    await fetch(
      url.toString(),
      {

        cache:
          "no-store"

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Błąd komunikacji z serwerem."
    );

  }


  return await response.json();

}


/************************************************
 * FORMAT DATY
 ************************************************/

function formatDate(
  dateString,
  dayName
) {

  const parts =
    dateString.split("-");

  return `
    ${dayName}
    ${parts[2]}.${parts[1]}
  `;

}


/************************************************
 * FORMAT PEŁNEJ DATY
 ************************************************/

function formatFullDate(
  dateString
) {

  const parts =
    dateString.split("-");

  return (
    parts[2] +
    "." +
    parts[1] +
    "." +
    parts[0]
  );

}


/************************************************
 * START
 ************************************************/

async function init() {

  if (!token) {

    showMessage(
      "Ten link rezerwacyjny jest nieprawidłowy.",
      "error"
    );

    scheduleBox.innerHTML =
      "";

    return;

  }


  try {

    await loadReservations();

    await loadSchedule();

  }
  catch(error) {

    console.error(
      error
    );


    showMessage(
      error.message ||
      "Nie udało się pobrać danych.",
      "error"
    );

  }

}


/************************************************
 * GRAFIK
 *
 * WAŻNE:
 * pobieramy 31 dni,
 * a nie tylko do końca miesiąca.
 ************************************************/

async function loadSchedule() {

  scheduleBox.innerHTML = `
    <div class="loading">
      Ładowanie grafiku...
    </div>
  `;


  eventsBox.innerHTML = `
    <div class="loading">
      Ładowanie wydarzeń...
    </div>
  `;


  const result =
    await api(
      "bookingSchedule",
      {

        startDate:
          todayString(),

        days:
          31

      }
    );


  if (
    !result.ok
  ) {

    throw new Error(
      result.msg ||
      "Nie udało się pobrać grafiku."
    );

  }


  showClient(
    result.client,
    result.clientStatus
  );


  renderSchedule(
    result.schedule
  );

}


/************************************************
 * KLIENTKA + STATUS KARNETU / WEJŚĆ
 ************************************************/

function statusValue(
  source,
  keys,
  fallback = ""
) {

  if (!source) {
    return fallback;
  }

  for (const key of keys) {

    if (
      source[key] !== undefined &&
      source[key] !== null &&
      source[key] !== ""
    ) {
      return source[key];
    }

  }

  return fallback;

}


function formatStatusDate(
  value
) {

  if (!value) {
    return "";
  }

  const text =
    String(value).trim();

  const match =
    text.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );

  if (match) {

    return (
      match[3] +
      "." +
      match[2] +
      "." +
      match[1]
    );

  }

  return text;

}


function cleanRechargeLabel(
  value
) {

  const text =
    String(value || "")
      .trim();

  const upper =
    text.toUpperCase();

  if (
    upper === "LEGACY" ||
    upper.includes("MIGRAC")
  ) {
    return "Saldo wejść";
  }

  if (
    upper === "INDYWIDUALNE" ||
    upper === "INDIVIDUAL"
  ) {
    return "Wejścia indywidualne";
  }

  if (
    upper === "KARNET" ||
    upper === "PASS"
  ) {
    return "Karnet";
  }

  return text;

}


function showClientStatus(
  status
) {

  if (
    !clientStatusBox ||
    !status
  ) {

    if (clientStatusBox) {
      clientStatusBox.style.display =
        "none";
    }

    return;

  }


  const balance =
    Number(
      statusValue(
        status,
        [
          "balance",
          "remaining",
          "availableBalance",
          "entries",
          "currentBalance"
        ],
        0
      )
    );


  const validTo =
    statusValue(
      status,
      [
        "validTo",
        "validUntil",
        "end",
        "expiryDate",
        "expiresAt"
      ],
      ""
    );


  const daysRemainingRaw =
    statusValue(
      status,
      [
        "daysRemaining",
        "daysLeft",
        "remainingDays"
      ],
      ""
    );


  const daysRemaining =
    daysRemainingRaw === ""
      ? ""
      : Number(daysRemainingRaw);


  const lastRecharge =
    status.lastRecharge ||
    status.latestRecharge ||
    status.lastTopUp ||
    {};


  const lastDate =
    statusValue(
      lastRecharge,
      [
        "date",
        "operationDate",
        "rechargeDate",
        "createdAt"
      ],
      statusValue(
        status,
        [
          "lastRechargeDate"
        ],
        ""
      )
    );


  const lastTypeRaw =
    statusValue(
      lastRecharge,
      [
        "type",
        "rechargeType",
        "name",
        "packageName"
      ],
      statusValue(
        status,
        [
          "lastRechargeType",
          "lastRechargeName"
        ],
        ""
      )
    );


  const lastAmountRaw =
    statusValue(
      lastRecharge,
      [
        "amount",
        "added",
        "entries",
        "quantity"
      ],
      statusValue(
        status,
        [
          "lastRechargeAmount"
        ],
        ""
      )
    );


  const lastAmount =
    lastAmountRaw === ""
      ? ""
      : Number(lastAmountRaw);


  const entryWord =
    balance === 1
      ? "wejście"
      : (
          balance >= 2 &&
          balance <= 4
            ? "wejścia"
            : "wejść"
        );


  let validityText =
    "";

  if (validTo) {

    validityText =
      "Ważne do " +
      formatStatusDate(validTo);

  }

  if (
    daysRemaining !== "" &&
    !isNaN(daysRemaining)
  ) {

    const dayWord =
      daysRemaining === 1
        ? "dzień"
        : "dni";

    validityText +=
      (
        validityText
          ? " · "
          : ""
      ) +
      "zostało " +
      daysRemaining +
      " " +
      dayWord;

  }


  let lastRechargeText =
    "";

  if (
    lastDate ||
    lastTypeRaw ||
    lastAmount !== ""
  ) {

    const parts =
      [];

    if (lastDate) {
      parts.push(
        formatStatusDate(lastDate)
      );
    }

    if (lastTypeRaw) {
      parts.push(
        cleanRechargeLabel(
          lastTypeRaw
        )
      );
    }

    if (
      lastAmount !== "" &&
      !isNaN(lastAmount)
    ) {

      const typeUpper =
        String(lastTypeRaw || "")
          .toUpperCase();

      const amountText =
        (
          typeUpper.includes("INDYWID") ||
          typeUpper === "INDIVIDUAL"
        )
          ? "+" + lastAmount
          : lastAmount + " wejść";

      parts.push(
        amountText
      );

    }

    lastRechargeText =
      parts.join(" · ");

  }


  clientStatusBox.innerHTML = `

    <div class="client-status-label">
      Twój aktualny stan
    </div>

    <div class="client-status-balance">
      ${balance} ${entryWord}
    </div>

    ${
      validityText
        ? `
            <div class="client-status-validity">
              ${validityText}
            </div>
          `
        : ""
    }

    ${
      lastRechargeText
        ? `
            <div class="client-status-divider"></div>

            <div class="client-status-last-label">
              Ostatnie doładowanie
            </div>

            <div class="client-status-last">
              ${lastRechargeText}
            </div>
          `
        : ""
    }

  `;


  clientStatusBox.style.display =
    "block";

}


function showClient(
  client,
  clientStatus
) {

  clientBox.style.display =
    "block";


  clientBox.innerHTML = `

    <strong>
      ${client.firstName}
      ${client.lastName}
    </strong>

    <br>

    <span>
      Tutaj możesz rezerwować swoje zajęcia
      oraz wydarzenia specjalne.
    </span>

  `;


  showClientStatus(
    clientStatus ||
    client.clientStatus ||
    client.status
  );

}


/************************************************
 * ROZDZIELENIE:
 *
 * CLASS
 * EVENT
 ************************************************/

function renderSchedule(
  schedule
) {

  if (
    !schedule ||
    schedule.length === 0
  ) {

    scheduleBox.innerHTML = `
      <div class="empty">
        Brak zaplanowanych zajęć.
      </div>
    `;

    eventsSection.style.display =
      "none";

    return;

  }


  const events =
    schedule.filter(
      item =>
        item.type === "EVENT"
    );


  const classes =
    schedule.filter(
      item =>
        item.type !== "EVENT"
    );


  renderEvents(
    events
  );


  renderClasses(
    classes
  );

}


/************************************************
 * RENDER EVENTÓW
 ************************************************/

function renderEvents(
  events
) {

  if (
    !events ||
    events.length === 0
  ) {

    eventsSection.style.display =
      "none";

    eventsBox.innerHTML =
      "";

    return;

  }


  eventsSection.style.display =
    "block";


  eventsBox.innerHTML =
    "";


  events
    .sort(
      (a, b) =>
        (
          a.date +
          a.hour
        )
        .localeCompare(
          b.date +
          b.hour
        )
    )
    .forEach(
      item => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "event-card";


        const full =
          item.full;


        const description =
          item.description
            ? `
              <div class="event-description">
                ${item.description}
              </div>
            `
            : "";


        card.innerHTML = `

          <div class="event-date">

            ${item.day}
            •
            ${formatFullDate(item.date)}
            •
            ${item.hour}

          </div>


          <div class="event-name">

            ${item.className}

          </div>


          ${description}


          <div class="event-availability">

            Wolne miejsca:

            <strong>
              ${item.available}
            </strong>

            z ${item.limit}

          </div>


          <button
            class="reserve event-reserve"

            ${
              full
                ? "disabled"
                : ""
            }

            onclick='reserveClass(
              ${JSON.stringify(item)}
            )'
          >

            ${
              full
                ? "BRAK WOLNYCH MIEJSC"
                : "🌿 ZAREZERWUJ MIEJSCE"
            }

          </button>

        `;


        eventsBox.appendChild(
          card
        );

      }
    );

}
/************************************************
 * RENDER REGULARNYCH ZAJĘĆ
 ************************************************/

function renderClasses(
  schedule
) {

  if (
    !schedule ||
    schedule.length === 0
  ) {

    scheduleBox.innerHTML = `
      <div class="empty">
        Brak zaplanowanych zajęć.
      </div>
    `;

    return;

  }


  const days = {};


  schedule.forEach(
    item => {

      if (
        !days[item.date]
      ) {

        days[item.date] = {

          day:
            item.day,

          classes:
            []

        };

      }


      days[item.date]
        .classes
        .push(
          item
        );

    }
  );


  scheduleBox.innerHTML =
    "";


  Object.keys(
    days
  )
  .sort()
  .forEach(
    date => {

      const dayData =
        days[date];


      const dayDiv =
        document.createElement(
          "div"
        );


      dayDiv.className =
        "day";


      dayDiv.innerHTML = `

        <div class="day-title">

          ${formatDate(
            date,
            dayData.day
          )}

        </div>

      `;


      dayData.classes
        .forEach(
          item => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "class-card";


            const full =
              item.full;


            card.innerHTML = `

              <div class="class-top">

                <div class="class-name">
                  ${item.className}
                </div>

                <div class="hour">
                  ${item.hour}
                </div>

              </div>


              <div class="info">

                Wolne miejsca:

                <strong>
                  ${item.available}
                </strong>

                z ${item.limit}

              </div>


              <button
                class="reserve"

                ${
                  full
                    ? "disabled"
                    : ""
                }

                onclick='reserveClass(
                  ${JSON.stringify(item)}
                )'
              >

                ${
                  full
                    ? "BRAK MIEJSC"
                    : "ZAREZERWUJ"
                }

              </button>

            `;


            dayDiv.appendChild(
              card
            );

          }
        );


      scheduleBox.appendChild(
        dayDiv
      );

    }
  );

}


/************************************************
 * REZERWACJA
 ************************************************/

async function reserveClass(
  item
) {

  const itemType =
    item.type === "EVENT"
      ? "wydarzenie"
      : "zajęcia";


  if (
    !confirm(
      `Czy chcesz zarezerwować ${itemType}:

${item.className}
${item.day}, ${item.hour}
${item.date}`
    )
  ) {

    return;

  }


  try {

    const result =
      await api(
        "bookingCreate",
        {

          date:
            item.date,

          hour:
            item.hour,

          className:
            item.className

        }
      );


    if (
      !result.ok
    ) {

      showMessage(
        result.msg ||
        "Nie udało się utworzyć rezerwacji.",
        "error"
      );

      return;

    }


    if (
      item.type === "EVENT"
    ) {

      showMessage(
        "Twoje miejsce na wydarzeniu zostało zarezerwowane. Do zobaczenia w Dobrej Przestrzeni! 🌿"
      );

    }
    else {

      showMessage(
        "Rezerwacja została potwierdzona."
      );

    }


    await loadReservations();

    await loadSchedule();

  }
  catch(error) {

    console.error(
      error
    );


    showMessage(
      "Wystąpił błąd podczas rezerwacji.",
      "error"
    );

  }

}


/************************************************
 * MOJE REZERWACJE
 ************************************************/

async function loadReservations() {

  reservationsBox.innerHTML = `
    <div class="loading">
      Ładowanie...
    </div>
  `;


  const result =
    await api(
      "bookingMyReservations"
    );


  if (
    !result.ok
  ) {

    throw new Error(
      result.msg ||
      "Nie udało się pobrać rezerwacji."
    );

  }


  renderReservations(
    result.reservations
  );

}


/************************************************
 * RENDER REZERWACJI
 ************************************************/

function renderReservations(
  reservations
) {

  const active =
    reservations.filter(
      r =>
        r.status === "CONFIRMED" ||
        r.status === "CHECKED_IN"
    );


  if (
    active.length === 0
  ) {

    reservationsBox.innerHTML = `
      <div class="empty">
        Nie masz obecnie żadnych
        aktywnych rezerwacji.
      </div>
    `;

    return;

  }


  reservationsBox.innerHTML =
    "";


  active
    .sort(
      (a, b) =>
        (
          a.date +
          a.hour
        )
        .localeCompare(
          b.date +
          b.hour
        )
    )
    .forEach(
      reservation => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "reservation";


        const cancelButton =
          reservation.status ===
          "CONFIRMED"

            ? `

              <button
                class="cancel"

                onclick="
                  cancelReservation(
                    '${reservation.reservationId}'
                  )
                "
              >

                ANULUJ REZERWACJĘ

              </button>

            `

            : `

              <div class="info">
                Obecność potwierdzona
              </div>

            `;


        div.innerHTML = `

          <strong>
            ${reservation.className}
          </strong>

          <br>

          ${reservation.date}
          — ${reservation.hour}

          ${cancelButton}

        `;


        reservationsBox.appendChild(
          div
        );

      }
    );

}


/************************************************
 * ANULOWANIE
 ************************************************/

async function cancelReservation(
  reservationId
) {

  if (
    !confirm(
      "Czy na pewno chcesz anulować tę rezerwację?"
    )
  ) {

    return;

  }


  try {

    const result =
      await api(
        "bookingCancel",
        {

          reservationId:
            reservationId

        }
      );


    if (
      !result.ok
    ) {

      showMessage(
        result.msg ||
        "Nie udało się anulować rezerwacji.",
        "error"
      );

      return;

    }


    showMessage(
      "Rezerwacja została anulowana."
    );


    await loadReservations();

    await loadSchedule();

  }
  catch(error) {

    console.error(
      error
    );


    showMessage(
      "Wystąpił błąd podczas anulowania.",
      "error"
    );

  }

}


/************************************************
 * START APLIKACJI
 ************************************************/

init();

</script>
